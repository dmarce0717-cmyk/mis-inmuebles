<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5c86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inmuebles">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mis Inmuebles</title>
<script src="lib/xlsx.full.min.js" defer></script>
<style>
  :root{
    --bg:#f3f5f7; --card:#fff; --ink:#18212b; --muted:#6a7684; --line:#e3e8ed;
    --pri:#1d5c86; --pri2:#e7f0f7; --ok:#18804f; --okbg:#e5f4ec; --bad:#bf3a2b; --badbg:#fbecea;
    --warn:#a8680f; --warnbg:#fdf3e1;
    --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;font-size:15px}
  header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:calc(12px + var(--safe-t)) 14px 12px;display:flex;align-items:center;gap:10px}
  header .ttl{flex:1;min-width:0}
  header h1{margin:0;font-size:18px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .sub{font-size:12px;opacity:.85;margin-top:2px;display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:#ffb4a8;display:inline-block}
  .dot.ok{background:#7ee2b0}.dot.sync{background:#ffe08a}
  .iconbtn{background:rgba(255,255,255,.14);border:none;color:#fff;font-size:20px;min-width:38px;height:38px;border-radius:10px;cursor:pointer;flex:none}
  main{padding:14px 14px calc(96px + var(--safe-b));max-width:760px;margin:0 auto}
  .tab{display:none}.tab.active{display:block}
  nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b)}
  nav.bottom button{flex:1;border:none;background:none;padding:9px 2px 8px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  nav.bottom button .ic{font-size:21px;line-height:1}
  nav.bottom button.active{color:var(--pri);font-weight:650}
  .fab{position:fixed;right:18px;bottom:calc(76px + var(--safe-b));z-index:6;width:56px;height:56px;border-radius:50%;border:none;background:var(--pri);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(29,92,134,.35);cursor:pointer}
  .hide{display:none!important}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h2{margin:0 0 10px;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .card h2 .lnk{font-size:13px;font-weight:600;color:var(--pri);background:none;border:none;cursor:pointer;padding:4px}
  .filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .filters > *{flex:1;min-width:130px}
  select,input,textarea{font:inherit;font-size:16px;width:100%;padding:10px 11px;border:1px solid #cfd7de;border-radius:10px;background:#fff;color:var(--ink)}
  textarea{min-height:70px;resize:vertical}
  label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
  .kpi .l{font-size:12px;color:var(--muted)}
  .kpi .v{font-size:19px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;word-break:break-all}
  .pos{color:var(--ok)}.neg{color:var(--bad)}.wrn{color:var(--warn)}
  .item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
  .item:last-child{border-bottom:none}
  .av{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;background:var(--pri2);overflow:hidden}
  .av img{width:100%;height:100%;object-fit:cover}
  .tx{flex:1;min-width:0}
  .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t2{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:650;margin-top:3px}
  .pill.ok{background:var(--okbg);color:var(--ok)} .pill.pend{background:var(--warnbg);color:var(--warn)} .pill.bad{background:var(--badbg);color:var(--bad)}
  .empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:14px}
  .total{display:flex;justify-content:space-between;font-weight:700;padding:10px 2px 0;border-top:2px solid var(--line);margin-top:4px}
  .bar{height:8px;border-radius:5px;background:var(--pri2);overflow:hidden;margin-top:6px}
  .bar > i{display:block;height:100%;background:var(--pri)}
  .conrow{padding:9px 0;border-bottom:1px solid var(--line)} .conrow:last-child{border-bottom:none}
  .conrow .h{display:flex;justify-content:space-between;font-size:14px}
  .group-h{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 4px 6px}
  .notice{background:var(--warnbg);border:1px solid #f0d8a6;color:#6e4a0c;border-radius:12px;padding:12px 13px;font-size:13.5px;margin-bottom:12px}
  .notice.err{background:var(--badbg);border-color:#efc3bd;color:#7c2219}
  .notice.info{background:var(--pri2);border-color:#c5dbeb;color:#18486a}
  .notice .btn{margin-top:10px}
  code.uri{display:block;background:#fff;border:1px dashed #c5dbeb;border-radius:8px;padding:8px;margin:6px 0;font-size:13px;word-break:break-all;user-select:all}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
  .kv .k{color:var(--muted)}
  .kv a{color:var(--pri);text-decoration:none;font-weight:600}
  .stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
  .stats3 .l{font-size:11.5px;color:var(--muted)} .stats3 .v{font-weight:700;font-size:15px;margin-top:3px;font-variant-numeric:tabular-nums}
  .back{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--pri);font:inherit;font-weight:650;padding:4px 0 10px;cursor:pointer}
  .seg{display:flex;background:#e6ebf0;border-radius:11px;padding:3px;margin-bottom:12px}
  .seg button{flex:1;border:none;background:none;padding:8px 4px;border-radius:9px;font:inherit;font-size:13.5px;color:var(--muted);cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);font-weight:650;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  /* hoja modal */
  .overlay{position:fixed;inset:0;background:rgba(15,23,32,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
  .overlay.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:8px 16px calc(18px + var(--safe-b))}
  @media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:18px}}
  .grab{width:40px;height:5px;border-radius:3px;background:#d5dbe1;margin:4px auto 10px}
  .sheet h3{margin:0 0 4px;font-size:17px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btns{display:flex;gap:10px;margin-top:16px}
  .btn{flex:1;font:inherit;font-weight:650;border:1px solid var(--pri);background:var(--pri);color:#fff;padding:12px;border-radius:12px;cursor:pointer;text-align:center}
  .btn.sec{background:#fff;color:var(--pri)}
  .btn.del{background:#fff;color:var(--bad);border-color:#e9b9b3}
  .btn.ok{background:var(--ok);border-color:var(--ok)}
  .btn.sm{flex:none;padding:8px 12px;font-size:13.5px}
  .btn:disabled{opacity:.5}
  .menu-item{display:flex;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px}
  .menu-item:last-child{border-bottom:none}
  .menu-item small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + var(--safe-b));background:#18212b;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .chip{border:1px solid #cfd7de;background:#fff;border-radius:16px;padding:7px 12px;font-size:13.5px;cursor:pointer;font-family:inherit}
  .chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
  .foto-prev{margin-top:8px;display:flex;gap:10px;align-items:center}
  .foto-prev img{width:96px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
  .fotobtn{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed #b9c6d2;border-radius:12px;padding:14px;color:var(--pri);font-weight:600;cursor:pointer;background:#fafcfd}
  .visor{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:40;display:none;align-items:center;justify-content:center}
  .visor.show{display:flex}
  .visor img{max-width:100%;max-height:100%}

  /* análisis */
  :root{ --s1:#2a78d6; --s2:#eb6834; --grid:#e8ecef; }
  .chart{position:relative}
  .chart .ax{font-size:10.5px;fill:var(--muted)}
  .legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin:-2px 0 8px}
  .legend i, .tip i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .tip{position:absolute;top:0;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.12);border-radius:10px;padding:8px 10px;font-size:12.5px;min-width:160px;pointer-events:none}
  .tip div{display:flex;align-items:center;margin-top:3px} .tip span{margin-left:auto;padding-left:12px;font-weight:650;font-variant-numeric:tabular-nums}
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
  .tbl th,.tbl td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  .tbl th{color:var(--muted);font-weight:600;font-size:11.5px}
  .tbl .num{text-align:right} .tbl tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:none}
  .scrollx{overflow-x:auto}
  .kpis.six{grid-template-columns:1fr 1fr}
  .nota{font-size:12.5px;color:var(--muted);margin:-4px 2px 12px}
  #aCon .t2, #aInmTabla .t2{white-space:normal}
</style>
</head>
<body>

<header>
  <div class="ttl"><h1 id="hdrTitle">🏢 Mis Inmuebles</h1><div class="sub"><span class="dot" id="syncDot"></span><span id="hdrSub">Cargando…</span></div></div>
  <button class="iconbtn" id="btnXls" aria-label="Descargar Excel" title="Descargar Excel">⤓</button>
  <button class="iconbtn" id="btnMenu" aria-label="Menú">⋯</button>
</header>

<main>
  <div id="notice"></div>

  <!-- RESUMEN -->
  <section class="tab active" id="tab-resumen">
    <div class="filters"><select id="rAnio"></select><select id="rMes"></select></div>
    <div class="filters"><select id="rInm"></select></div>
    <div class="kpis">
      <div class="kpi"><div class="l">Ingresos</div><div class="v pos" id="kIng">$0</div></div>
      <div class="kpi"><div class="l">Egresos</div><div class="v neg" id="kEgr">$0</div></div>
      <div class="kpi"><div class="l">Balance</div><div class="v" id="kBal">$0</div></div>
      <div class="kpi"><div class="l">Por pagar</div><div class="v wrn" id="kPend">$0</div></div>
    </div>
    <div class="card"><h2>Balance por inmueble</h2><div id="resInm"></div></div>
    <div class="card"><h2>Egresos por concepto</h2><div id="resCon"></div></div>
  </section>

  <!-- INMUEBLES -->
  <section class="tab" id="tab-inmuebles"><div id="listInm"></div></section>

  <!-- DETALLE DE UN INMUEBLE -->
  <section class="tab" id="tab-detalle">
    <button class="back" id="btnVolver">‹ Inmuebles</button>
    <div id="detHead"></div>
    <div class="seg" id="segDet">
      <button data-s="ingresos" class="on">Ingresos</button>
      <button data-s="egresos">Egresos</button>
      <button data-s="admin">Admón.</button>
      <button data-s="inventario">Inventario</button>
    </div>
    <div id="detIngresos"></div>
    <div id="detEgresos" class="hide"></div>
    <div id="detAdmin" class="hide"></div>
    <div id="detInventario" class="hide"></div>
  </section>

  <!-- ANÁLISIS ECONÓMICO -->
  <section class="tab" id="tab-analisis">
    <div class="filters"><select id="aAnio" aria-label="Año"></select><select id="aInm" aria-label="Inmueble"></select></div>
    <div class="kpis six" id="aKpis"></div>
    <div class="nota" id="aNotaAnt"></div>
    <div class="card"><h2>Ingresos y egresos por mes</h2>
      <div class="legend"><span><i style="background:var(--s1)"></i>Ingresos</span><span><i style="background:var(--s2)"></i>Egresos</span></div>
      <div class="chart" id="aChart"></div>
      <div class="t2" style="white-space:normal;margin-top:4px">Toca un mes para ver el detalle.</div>
    </div>
    <div class="card"><h2>Flujo mensual</h2><div class="scrollx" id="aTabla"></div></div>
    <div class="card"><h2>¿En qué se va la plata?</h2><div id="aCon"></div></div>
    <div class="card"><h2>Rentabilidad por inmueble</h2><div id="aInmTabla"></div></div>
  </section>
</main>

<button class="fab hide" id="fab" aria-label="Agregar">+</button>

<nav class="bottom">
  <button class="active" data-tab="resumen"><span class="ic">📊</span>Resumen</button>
  <button data-tab="inmuebles"><span class="ic">🏠</span>Inmuebles</button>
  <button data-tab="analisis"><span class="ic">📈</span>Análisis</button>
</nav>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="visor" id="visor"><img id="visorImg" alt=""></div>
<input type="file" id="fileImport" accept=".xlsx" style="display:none">
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =====================================================================
   UTILIDADES
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => "$" + Math.round(Number(n)||0).toLocaleString("es-CO");
const pad = n => String(n).padStart(2,"0");
const hoy = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const CON_ING = ["Arriendo","Depósito","Reintegro","Parqueadero","Otro"];
const CON_EGR = ["Administración","Agua","Energía","Gas","Internet","Predial","Mantenimiento","Otro"];
const ICON_EGR = {"Administración":"🏢","Agua":"💧","Energía":"⚡","Gas":"🔥","Internet":"📶","Predial":"🧾","Mantenimiento":"🔧","Otro":"📌"};
const ICON_ING = {"Arriendo":"🔑","Depósito":"🏦","Reintegro":"↩️","Parqueadero":"🚗","Otro":"💵"};
const ESPACIOS = ["Sala","Comedor","Cocina","Habitación principal","Habitación 2","Habitación 3","Baño principal","Baño social","Estudio","Balcón / Patio","Zona de ropas","Parqueadero / Depósito","General"];
const ESTADOS = ["Bueno","Regular","Malo"];
const fechaCorta = f => { if(!f) return ""; const [y,m,d]=String(f).split("-"); return `${Number(d)} ${(MESES[Number(m)-1]||"").slice(0,3).toLowerCase()} ${y}`; };
const periodoTxt = p => { if(!p) return ""; const [y,m]=String(p).split("-"); return `${MESES[Number(m)-1]||""} ${y}`; };
const sum = a => a.reduce((s,x)=>s+(+x.valor||0),0);

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2800); }

/* =====================================================================
   ALMACENAMIENTO LOCAL (IndexedDB) — copia en el celular para trabajar sin internet
   ===================================================================== */
const IDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("mis-inmuebles", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => { const d = await open(); return new Promise((res, rej) => {
    const t = d.transaction("kv", mode); const st = t.objectStore("kv"); const q = fn(st);
    t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
  return {
    get: k => tx("readonly", s => s.get(k)).catch(() => undefined),
    set: (k, v) => tx("readwrite", s => s.put(v, k)).catch(e => console.warn(e)),
    del: k => tx("readwrite", s => s.delete(k)).catch(() => {})
  };
})();

/* =====================================================================
   DATOS
   Cada colección es un objeto {id: registro}. Cada registro lleva "upd" (fecha de cambio)
   y, si se elimina, queda como {id, del:true, upd} para que el borrado llegue a los demás equipos.
   ===================================================================== */
const COLS = ["inmuebles","ingresos","egresos","inventario"];
let D = { v:1, inmuebles:{}, ingresos:{}, egresos:{}, inventario:{} };
let meta = { lastBackup:null, sucios:{}, cfg:null, ultimaSync:null };

const lista = col => Object.values(D[col]||{}).filter(r => r && !r.del);
const getR = (col,id) => { const r=D[col]?.[id]; return r && !r.del ? r : null; };

async function guardarLocal(){ await IDB.set("datos", D); await IDB.set("meta", meta); }

function poner(col, rec){
  rec.upd = Date.now(); D[col][rec.id] = rec; marcarSucio(col, rec.id);
  guardarLocal(); programarSync(); renderTodo();
}
function quitar(col, id){
  if(!D[col][id]) return;
  D[col][id] = { id, del:true, upd:Date.now() }; marcarSucio(col, id);
  guardarLocal(); programarSync(); renderTodo();
}
function fusionar(a, b){
  const out = { v:1 };
  for(const c of COLS){
    out[c] = { ...(a?.[c]||{}) };
    for(const [id, r] of Object.entries(b?.[c]||{})){
      if(!out[c][id] || (r.upd||0) > (out[c][id].upd||0)) out[c][id] = r;
    }
  }
  return out;
}

/* =====================================================================
   BASE DE DATOS COMPARTIDA (Google Sheets)
   El celular guarda una copia y la sincroniza con la hoja de Google.
   ===================================================================== */
const CFG_KEY = "mi_sheets";
let cfg = (() => { try{ return JSON.parse(localStorage.getItem(CFG_KEY) || "null"); }catch(e){ return null; } })();
let syncing = false, otraVez = false, syncTimer = null, estadoSync = "idle", ultimoError = "";

function guardarCfg(c){ cfg = c; try{ if(c) localStorage.setItem(CFG_KEY, JSON.stringify(c)); else localStorage.removeItem(CFG_KEY); }catch(e){} meta.cfg = c; guardarLocal(); }
function marcarSucio(col, id){ (meta.sucios[col] = meta.sucios[col] || {})[id] = true; }
function marcarTodoSucio(){ for(const c of COLS) for(const id of Object.keys(D[c])) marcarSucio(c, id); }
const nSucios = () => COLS.reduce((s,c) => s + Object.keys(meta.sucios[c]||{}).length, 0);
function programarSync(ms = 1500){ if(!cfg) return; clearTimeout(syncTimer); syncTimer = setTimeout(sincronizar, ms); }

function aFila(col, r){
  if(r.del) return { id:r.id, upd:r.upd, del:true };
  if(col === "inmuebles"){ const a = r.admin || {};
    return { id:r.id, upd:r.upd, conjunto:r.conjunto, torre:r.torre, apartamento:r.apartamento, propietario:r.propietario||"", ciudad:r.ciudad||"", notas:r.notas||"",
      admin_nombre:a.nombre||"", admin_empresa:a.empresa||"", admin_telefono:a.telefono||"", admin_correo:a.correo||"", admin_cuota:a.cuota||"", admin_diaPago:a.diaPago||"", admin_referencia:a.referencia||"", admin_notas:a.notas||"" }; }
  const f = String(r.fecha || "");
  return { ...r, inmueble: etq(r.inmuebleId), anio: Number(f.slice(0,4)) || "", mes: Number(f.slice(5,7)) || "" };
}
function deFila(col, o){
  const s = v => v === null || v === undefined ? "" : String(v), n = v => v === "" || v === null || v === undefined ? "" : Number(v);
  const base = { id:s(o.id), upd:Number(o.upd)||0 };
  if(col === "inmuebles") return { ...base, conjunto:s(o.conjunto), torre:s(o.torre), apartamento:s(o.apartamento), propietario:s(o.propietario), ciudad:s(o.ciudad), notas:s(o.notas),
    admin:{ nombre:s(o.admin_nombre), empresa:s(o.admin_empresa), telefono:s(o.admin_telefono), correo:s(o.admin_correo), cuota:n(o.admin_cuota), diaPago:n(o.admin_diaPago), referencia:s(o.admin_referencia), notas:s(o.admin_notas) } };
  if(col === "ingresos") return { ...base, inmuebleId:s(o.inmuebleId), fecha:s(o.fecha).slice(0,10), concepto:s(o.concepto), valor:Number(o.valor)||0, medio:s(o.medio), notas:s(o.notas) };
  if(col === "egresos") return { ...base, inmuebleId:s(o.inmuebleId), fecha:s(o.fecha).slice(0,10), concepto:s(o.concepto), periodo:s(o.periodo).slice(0,7), valor:Number(o.valor)||0, estado:s(o.estado)||"Pagado", notas:s(o.notas) };
  return { ...base, inmuebleId:s(o.inmuebleId), espacio:s(o.espacio), nombre:s(o.nombre), cantidad:Number(o.cantidad)||1, estado:s(o.estado)||"Bueno", descripcion:s(o.descripcion), observaciones:s(o.observaciones), foto:s(o.foto) };
}
async function llamarSheets(c, changes){
  const r = await fetch(c.url, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ action:"sync", key:c.key, changes }), redirect:"follow" });
  const t = await r.text();
  try{ return JSON.parse(t); }catch(e){ throw Object.assign(new Error("respuesta"), { codigo:"respuesta" }); }
}
async function sincronizar(){
  if(!cfg){ pintarEstado(); return; }
  if(!navigator.onLine){ estadoSync = "offline"; pintarEstado(); return; }
  if(syncing){ otraVez = true; return; }
  syncing = true; estadoSync = "sync"; pintarEstado();
  try{
    const changes = {}, enviados = {};
    for(const c of COLS){
      changes[c] = []; enviados[c] = {};
      for(const id of Object.keys(meta.sucios[c] || {})){ const r = D[c][id]; if(r){ changes[c].push(aFila(c, r)); enviados[c][id] = r.upd; } }
    }
    const j = await llamarSheets(cfg, changes);
    if(!j.ok) throw Object.assign(new Error(j.error), { codigo:j.error });
    // quitar de pendientes lo que se subió y no cambió mientras tanto
    for(const c of COLS) for(const [id, upd] of Object.entries(enviados[c])) if(D[c][id] && D[c][id].upd === upd) delete meta.sucios[c][id];
    // traer lo que hay en la hoja
    for(const c of COLS) for(const o of (j.data[c] || [])){
      const r = deFila(c, o), l = D[c][r.id];
      if(!l || (r.upd||0) > (l.upd||0)) D[c][r.id] = r;
    }
    for(const t of (j.data._borrados || [])){
      const l = D[t.col] && D[t.col][t.id];
      if(l && !l.del && (l.upd||0) <= Number(t.upd)) D[t.col][t.id] = { id:t.id, del:true, upd:Number(t.upd) };
    }
    meta.ultimaSync = new Date().toISOString(); estadoSync = "ok"; ultimoError = "";
    await guardarLocal();
  }catch(e){
    console.error(e); estadoSync = "error";
    ultimoError = e.codigo === "clave" ? "La clave no coincide con la del código en Google." :
                  e.codigo === "ocupado" ? "La base estaba ocupada; se reintentará." :
                  e.codigo === "respuesta" ? "Google no respondió como se esperaba. Revisa que la URL termine en /exec y que el acceso sea “Cualquier usuario”." :
                  "No se pudo conectar con Google Sheets.";
  }finally{
    syncing = false; renderTodo();
    if(otraVez){ otraVez = false; programarSync(300); }
  }
}
function pintarEstado(){
  const dot = $("syncDot"), sub = $("hdrSub"), n = lista("inmuebles").length;
  const base = `${n} inmueble${n===1?"":"s"} · `;
  if(!cfg){ dot.className = "dot"; sub.textContent = base + "solo en este celular"; return; }
  if(estadoSync === "sync"){ dot.className = "dot sync"; sub.textContent = base + "sincronizando…"; return; }
  if(estadoSync === "error"){ dot.className = "dot"; sub.textContent = base + "error al sincronizar (toca para reintentar)"; return; }
  if(!navigator.onLine){ dot.className = "dot sync"; sub.textContent = base + "sin internet · se sube al reconectar"; return; }
  const p = nSucios();
  dot.className = p ? "dot sync" : "dot ok";
  sub.textContent = base + (p ? `${p} cambio${p>1?"s":""} por subir` : "base compartida al día");
}

  if($("cCan")) $("cCan").onclick = cerrarHoja;
  if($("cOff")) $("cOff").onclick = async () => { if(await confirmar("Este celular dejará de sincronizarse. Los datos que ya tiene se quedan aquí.", "Desconectar")){ guardarCfg(null); estadoSync = "idle"; renderTodo(); toast("Desconectado"); } };
  $("cOk").onclick = async () => {
    const c = { url:$("cUrl").value.trim(), key:$("cKey").value.trim() };
    if(!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec/.test(c.url)) return ($("cMsg").textContent = "La URL debe empezar por https://script.google.com/ y terminar en /exec");
    if(!c.key) return ($("cMsg").textContent = "Escribe la clave");
    $("cOk").disabled = true; $("cMsg").textContent = "Probando la conexión…";
    try{
      const j = await llamarSheets(c, {});
      if(!j.ok){ $("cMsg").textContent = j.error === "clave" ? "La clave no coincide con la que pusiste en el código de Google." : "Error: " + j.error; $("cOk").disabled = false; return; }
      guardarCfg(c); marcarTodoSucio(); await guardarLocal(); cerrarHoja(); toast("Conectada a la base compartida ✔"); sincronizar();
    }catch(e){ $("cMsg").textContent = "No se pudo conectar. Revisa la URL (debe terminar en /exec) y que la implementación tenga acceso para “Cualquier usuario”."; $("cOk").disabled = false; }
  };

function linkCompartir(){
  const datos = btoa(unescape(encodeURIComponent(JSON.stringify({ u:cfg.url, k:cfg.key }))));
  return location.origin + location.pathname + "#conectar=" + datos;
}
async function compartirConexion(){
  if(!cfg) return toast("Primero conecta la base compartida");
  const url = linkCompartir();
  const texto = "Abre este enlace para conectarte a nuestra base de Mis Inmuebles:";
  if(navigator.share){ try{ await navigator.share({ title:"Mis Inmuebles", text:texto, url }); return; }catch(e){ if(e.name === "AbortError") return; } }
  abrirHoja(`<h3>Compartir con otra persona</h3><div class="t2" style="white-space:normal">Envíale este enlace. Al abrirlo, su app queda conectada a la misma base.</div>
    <code class="uri" id="shUrl">${esc(url)}</code><div class="btns"><button class="btn sec" id="shCer">Cerrar</button><button class="btn" id="shCopy">Copiar enlace</button></div>`);
  $("shCer").onclick = cerrarHoja;
  $("shCopy").onclick = async () => { try{ await navigator.clipboard.writeText(url); toast("Enlace copiado ✔"); }catch(e){ toast("Mantén presionado el enlace para copiarlo"); } };
}
function leerEnlaceConexion(){
  const h = location.hash;
  if(!h.startsWith("#conectar=")) return false;
  try{
    const o = JSON.parse(decodeURIComponent(escape(atob(h.slice(10)))));
    if(o.u && o.k){ guardarCfg({ url:o.u, key:o.k }); marcarTodoSucio(); history.replaceState(null, "", location.pathname); return true; }
  }catch(e){ console.warn(e); }
  history.replaceState(null, "", location.pathname);
  return false;
}

/* ---------- fotos (guardadas en el celular) ---------- */
const fotoURL = new Map();
async function comprimir(file){
  let bmp;
  try{ bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch(e){ bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const max = 1280, w = bmp.width, h = bmp.height, k = Math.min(1, max / Math.max(w, h));
  const cv = document.createElement("canvas"); cv.width = Math.round(w*k); cv.height = Math.round(h*k);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  return new Promise(res => cv.toBlob(b => res(b), "image/jpeg", 0.75));
}
async function guardarFoto(nombre, blob){ await IDB.set("foto:" + nombre, blob); fotoURL.set(nombre, URL.createObjectURL(blob)); }
async function borrarFoto(nombre){ if(!nombre) return; await IDB.del("foto:" + nombre); fotoURL.delete(nombre); }
async function urlFoto(nombre){
  if(!nombre) return null;
  if(fotoURL.has(nombre)) return fotoURL.get(nombre);
  const b = await IDB.get("foto:" + nombre); if(!b) return null;
  const u = URL.createObjectURL(b); fotoURL.set(nombre, u); return u;
}
async function pintarFotos(root){
  for(const img of root.querySelectorAll("img[data-foto]")){ const u = await urlFoto(img.dataset.foto); if(u){ img.src = u; img.style.display = ""; const sp = img.previousElementSibling; if(sp) sp.remove(); } }
}
$("visor").onclick = () => $("visor").classList.remove("show");
function verFoto(nombre){ urlFoto(nombre).then(u => { if(u){ $("visorImg").src = u; $("visor").classList.add("show"); } }); }

  const i = getR("inmuebles", id) || {};
  const conjuntos = [...new Set(lista("inmuebles").map(x => x.conjunto))];
  abrirHoja(`<h3>${id?"Editar":"Nuevo"} inmueble</h3>
    <label>Nombre del conjunto *</label><input id="fConj" list="dlConj" value="${esc(i.conjunto)}" placeholder="Ej: Conjunto Los Pinos" autocomplete="off">
    <datalist id="dlConj">${conjuntos.map(c => `<option value="${esc(c)}">`).join("")}</datalist>
    <div class="row2"><div><label>Torre *</label><input id="fTorre" value="${esc(i.torre)}" placeholder="Ej: 3"></div>
    <div><label>Apartamento *</label><input id="fApto" value="${esc(i.apartamento)}" placeholder="Ej: 502"></div></div>
    <label>Propietario / Arrendatario</label><input id="fProp" value="${esc(i.propietario)}">
    <label>Ciudad</label><input id="fCiudad" value="${esc(i.ciudad)}">
    <label>Notas</label><input id="fNotas" value="${esc(i.notas)}">
    <div class="btns">${id?`<button class="btn del" id="bDel">Eliminar</button>`:`<button class="btn sec" id="bCan">Cancelar</button>`}<button class="btn" id="bOk">Guardar</button></div>`);
  if($("bCan")) $("bCan").onclick = cerrarHoja;
  $("bOk").onclick = () => {
    const v = { conjunto:$("fConj").value.trim(), torre:$("fTorre").value.trim(), apartamento:$("fApto").value.trim(), propietario:$("fProp").value.trim(), ciudad:$("fCiudad").value.trim(), notas:$("fNotas").value.trim() };
    if(!v.conjunto || !v.torre || !v.apartamento) return toast("Completa conjunto, torre y apartamento");
    if(lista("inmuebles").some(x => x.id!==id && x.conjunto.toLowerCase()===v.conjunto.toLowerCase() && String(x.torre)===v.torre && String(x.apartamento)===v.apartamento)) return toast("Ese inmueble ya existe");
    const nuevoId = id || uid();
    poner("inmuebles", { ...i, ...v, id: nuevoId });
    cerrarHoja(); toast("Inmueble guardado ✔");
    if(!id) abrirDetalle(nuevoId, "ingresos");
  };
  if(id) $("bDel").onclick = async () => {
    const movs = [...lista("ingresos"), ...lista("egresos"), ...lista("inventario")].filter(x => x.inmuebleId === id);
    if(!(await confirmar(movs.length ? `Este inmueble tiene ${movs.length} registros (movimientos e inventario) que también se eliminarán.` : "Se eliminará este inmueble."))) return;
    for(const c of ["ingresos","egresos","inventario"]) for(const r of lista(c).filter(x => x.inmuebleId === id)){ if(r.foto) await borrarFoto(r.foto); D[c][r.id] = { id:r.id, del:true, upd:Date.now() }; marcarSucio(c, r.id); }
    quitar("inmuebles", id); irA("inmuebles"); toast("Inmueble eliminado");
  };
}

  const grupos = {}; arr.forEach(i => (grupos[i.conjunto] = grupos[i.conjunto] || []).push(i));
  $("listInm").innerHTML = Object.entries(grupos).map(([c, xs]) => `<div class="group-h">${esc(c)}</div><div class="card">` +
    xs.map(i => {
      const bal = sum(lista("ingresos").filter(x => x.inmuebleId===i.id)) - sum(lista("egresos").filter(x => x.inmuebleId===i.id));
      const nInv = lista("inventario").filter(x => x.inmuebleId===i.id).length;

    <label>Estado</label><div class="chips" id="vEst">${ESTADOS.map(e => `<button type="button" class="chip ${e===estado?"on":""}" data-e="${e}">${e==="Bueno"?"🟢":e==="Regular"?"🟡":"🔴"} ${e}</button>`).join("")}</div>
    <label>Marca / modelo / descripción</label><input id="vDes" value="${esc(x.descripcion)}">
    <label>Observaciones</label><textarea id="vObs" placeholder="Ej: rayón en la puerta, funciona bien">${esc(x.observaciones)}</textarea>
    <label>Foto</label>
    <div id="vFotoBox"></div>
    <input type="file" id="vFile" accept="image/*" style="display:none">
    <div class="btns">${id?`<button class="btn del" id="bDel">Eliminar</button>`:`<button class="btn sec" id="bCan">Cancelar</button>`}<button class="btn" id="bOk">Guardar</button></div>`);
  const pintarCaja = async () => {
    const box = $("vFotoBox"); if(!box) return;
    const actual = fotoNueva ? URL.createObjectURL(fotoNueva) : (!fotoQuitada && x.foto ? await urlFoto(x.foto) : null);
    box.innerHTML = actual
      ? `<div class="foto-prev"><img src="${actual}" alt="" id="vImg"><div style="display:flex;flex-direction:column;gap:8px"><button type="button" class="btn sec sm" id="vCam">Cambiar foto</button><button type="button" class="btn del sm" id="vQuit">Quitar</button></div></div>`
      : (!fotoQuitada && x.foto ? `<div class="t2">La foto se descargará cuando haya conexión.</div>` : "") + `<div class="fotobtn" id="vCam">📷 Tomar o elegir foto</div>`;
    $("vCam").onclick = () => $("vFile").click();
    if($("vQuit")) $("vQuit").onclick = () => { fotoNueva = null; fotoQuitada = true; pintarCaja(); };
    if($("vImg") && x.foto && !fotoNueva) $("vImg").onclick = () => verFoto(x.foto);
  };
  pintarCaja();
  $("vFile").onchange = async ev => { const f = ev.target.files[0]; if(!f) return; try{ fotoNueva = await comprimir(f); fotoQuitada = false; pintarCaja(); }catch(e){ toast("No se pudo leer la imagen"); } };
  $("vEst").querySelectorAll(".chip").forEach(c => c.onclick = () => { estado = c.dataset.e; $("vEst").querySelectorAll(".chip").forEach(z => z.classList.toggle("on", z === c)); });
  if($("bCan")) $("bCan").onclick = cerrarHoja;
  $("bOk").onclick = async () => {
    const v = { nombre:$("vNom").value.trim(), espacio:$("vEsp").value.trim() || "General", cantidad:Math.max(1, Number($("vCan").value)||1), estado,
      descripcion:$("vDes").value.trim(), observaciones:$("vObs").value.trim() };
    if(!v.nombre) return toast("Escribe el nombre del elemento");
    $("bOk").disabled = true;
    const rid = id || uid();
    let foto = x.foto || "";
    if(fotoQuitada || fotoNueva){ if(x.foto) await borrarFoto(x.foto); foto = ""; }
    if(fotoNueva){ foto = `${rid}_${Date.now().toString(36)}.jpg`; await guardarFoto(foto, fotoNueva); }
    poner("inventario", { ...x, ...v, id:rid, foto });
    cerrarHoja(); toast("Inventario guardado ✔");
  };
  if(id) $("bDel").onclick = async () => { if(await confirmar("Se eliminará este elemento del inventario.")){ if(x.foto) await borrarFoto(x.foto); quitar("inventario", id); toast("Elemento eliminado"); } };
}

/* =====================================================================
   RESUMEN
   ===================================================================== */
function renderResumen(){
  const anioAct = String(new Date().getFullYear());
  const anios = [...new Set([...lista("ingresos"), ...lista("egresos")].map(x => String(x.fecha).slice(0,4)).filter(a => /^\d{4}$/.test(a)).concat([anioAct]))].sort().reverse();
  const sa = $("rAnio"), prev = sa.dataset.init ? sa.value : anioAct;
  sa.innerHTML = `<option value="">Todos los años</option>` + anios.map(a => `<option ${a===prev?"selected":""}>${a}</option>`).join("");
  sa.value = anios.includes(prev) ? prev : ""; sa.dataset.init = "1";
  const sm = $("rMes"); if(!sm.options.length) sm.innerHTML = `<option value="">Todo el año</option>` + MESES.map((m,i) => `<option value="${pad(i+1)}">${m}</option>`).join("");
  const A = sa.value, M = sm.value, I = $("rInm").value;
  const ok = x => (!A || String(x.fecha).slice(0,4) === A) && (!M || String(x.fecha).slice(5,7) === M) && (!I || x.inmuebleId === I);
  const ing = lista("ingresos").filter(ok), egr = lista("egresos").filter(ok);
  const tI = sum(ing), tE = sum(egr), tP = sum(lista("egresos").filter(e => e.estado==="Pendiente" && (!I || e.inmuebleId===I)));
  $("kIng").textContent = fmt(tI); $("kEgr").textContent = fmt(tE); $("kPend").textContent = fmt(tP);
  $("kBal").textContent = fmt(tI - tE); $("kBal").className = "v " + (tI - tE >= 0 ? "pos" : "neg");
  const inms = inmOrdenados().filter(i => !I || i.id === I);
  $("resInm").innerHTML = !inms.length ? `<div class="empty">Registra tus inmuebles en la pestaña <b>Inmuebles</b>.</div>` :
    inms.map(i => { const a = sum(ing.filter(x => x.inmuebleId===i.id)), b = sum(egr.filter(x => x.inmuebleId===i.id));
      return `<div class="item" data-inm="${esc(i.id)}"><div class="tx"><div class="t1">${esc(etq(i.id))}</div><div class="t2"><span class="pos">+${fmt(a)}</span> · <span class="neg">−${fmt(b)}</span></div></div><div class="amt ${a-b>=0?"pos":"neg"}">${fmt(a-b)}</div></div>`; }).join("");
  $("resInm").querySelectorAll("[data-inm]").forEach(el => el.onclick = () => abrirDetalle(el.dataset.inm, "ingresos"));
  const cons = [...new Set(CON_EGR.concat(egr.map(e => e.concepto)))].map(c => [c, sum(egr.filter(e => e.concepto===c))]).filter(x => x[1] > 0).sort((a,b) => b[1]-a[1]);
  $("resCon").innerHTML = !cons.length ? `<div class="empty">Sin egresos en este periodo.</div>` :
    cons.map(([c,v]) => `<div class="conrow"><div class="h"><span>${ICON_EGR[c]||"📌"} ${esc(c)}</span><b>${fmt(v)} <span style="font-weight:400;color:var(--muted);font-size:12px">${(v/tE*100).toFixed(0)}%</span></b></div><div class="bar"><i style="width:${(v/cons[0][1]*100).toFixed(1)}%"></i></div></div>`).join("");
}

function renderAviso(){
  const n = $("notice");
  if(!cfg){
    if(meta.avisoCerrado){ n.innerHTML = ""; return; }
    n.innerHTML = `<div class="notice info"><b>Conecta la base de datos compartida.</b> Así tú y la otra persona ven y registran la misma información, guardada en una hoja de Google Sheets.
      <div class="btns"><button class="btn sec" id="bAvNo">Ahora no</button><button class="btn" id="bAvSi">Conectar</button></div></div>`;
    $("bAvSi").onclick = formConexion;
    $("bAvNo").onclick = () => { meta.avisoCerrado = true; guardarLocal(); renderAviso(); };
    return;
  }
  if(estadoSync === "error" && ultimoError){
    n.innerHTML = `<div class="notice err"><b>No se pudo sincronizar.</b> ${esc(ultimoError)} Tus cambios quedan guardados en el celular y se suben cuando se arregle.
      <div class="btns"><button class="btn sec" id="bErrCfg">Revisar conexión</button><button class="btn" id="bErrRe">Reintentar</button></div></div>`;
    $("bErrCfg").onclick = formConexion; $("bErrRe").onclick = sincronizar;
    return;
  }
  n.innerHTML = "";
}

/* =====================================================================
   ANÁLISIS ECONÓMICO
   ===================================================================== */
const MES3 = MESES.map(m => m.slice(0,3));
function datosAnalisis(anio, inm){
  const deInm = x => !inm || x.inmuebleId === inm;
  const ing = lista("ingresos").filter(deInm), egr = lista("egresos").filter(deInm);
  const delAnio = (arr, a) => arr.filter(x => String(x.fecha).slice(0,4) === a);
  const iA = delAnio(ing, anio), eA = delAnio(egr, anio);
  const meses = MESES.map((_, k) => {
    const mm = `${anio}-${pad(k+1)}`;
    const a = sum(iA.filter(x => String(x.fecha).startsWith(mm))), b = sum(eA.filter(x => String(x.fecha).startsWith(mm)));
    return { k, ing:a, egr:b, util:a-b };
  });
  let acc = 0; meses.forEach(m => { acc += m.util; m.acum = acc; });
  const ant = String(Number(anio) - 1);
  return { iA, eA, meses, tI:sum(iA), tE:sum(eA), utilAnt: sum(delAnio(ing, ant)) - sum(delAnio(egr, ant)), hayAnt: delAnio(ing, ant).length + delAnio(egr, ant).length > 0 };
}

function renderAnalisis(){
  const anioAct = String(new Date().getFullYear());
  const anios = [...new Set([...lista("ingresos"), ...lista("egresos")].map(x => String(x.fecha).slice(0,4)).filter(a => /^\d{4}$/.test(a)).concat([anioAct]))].sort().reverse();
  const sa = $("aAnio"), prev = sa.value || anioAct;
  sa.innerHTML = anios.map(a => `<option ${a===prev?"selected":""}>${a}</option>`).join("");
  if(!anios.includes(prev)) sa.value = anioAct;
  const A = sa.value, I = $("aInm").value;
  const d = datosAnalisis(A, I);
  const util = d.tI - d.tE, margen = d.tI ? util / d.tI * 100 : null;
  const esActual = A === anioAct, mesesCorridos = esActual ? new Date().getMonth() + 1 : 12;
  const promUtil = util / mesesCorridos;

  // KPIs
  const varAnt = d.hayAnt && d.utilAnt !== 0 ? (util - d.utilAnt) / Math.abs(d.utilAnt) * 100 : null;
  $("aKpis").innerHTML = `
    <div class="kpi"><div class="l">Utilidad neta ${A}</div><div class="v ${util>=0?"pos":"neg"}">${fmt(util)}</div></div>
    <div class="kpi"><div class="l">Margen sobre ingresos</div><div class="v">${margen===null?"—":margen.toFixed(1)+"%"}</div></div>
    <div class="kpi"><div class="l">Utilidad promedio / mes</div><div class="v">${fmt(promUtil)}</div></div>
    <div class="kpi"><div class="l">${esActual ? "Proyección al cierre del año" : "Frente al año anterior"}</div><div class="v">${esActual ? fmt(promUtil*12) : (varAnt===null ? "—" : (varAnt>=0?"+":"")+varAnt.toFixed(0)+"%")}</div></div>
    <div class="kpi"><div class="l">Ingresos ${A}</div><div class="v">${fmt(d.tI)}</div></div>
    <div class="kpi"><div class="l">Egresos ${A}</div><div class="v">${fmt(d.tE)}</div></div>`;
  $("aNotaAnt").textContent = esActual && varAnt !== null ? `Frente a ${Number(A)-1}: ${varAnt>=0?"+":""}${varAnt.toFixed(0)}% en utilidad (${fmt(d.utilAnt)} el año anterior).` : (esActual ? `Proyección = utilidad promedio de ${mesesCorridos} mes${mesesCorridos>1?"es":""} × 12.` : "");

  // Gráfica mensual (barras agrupadas: ingresos vs egresos)
  dibujarMensual(d.meses);

  // Tabla mensual
  $("aTabla").innerHTML = `<table class="tbl"><thead><tr><th>Mes</th><th class="num">Ingresos</th><th class="num">Egresos</th><th class="num">Utilidad</th><th class="num">Acumulada</th></tr></thead><tbody>` +
    d.meses.map(m => `<tr><td>${MES3[m.k]}</td><td class="num">${m.ing?fmt(m.ing):"—"}</td><td class="num">${m.egr?fmt(m.egr):"—"}</td><td class="num ${m.util<0?"neg":""}">${m.ing||m.egr?fmt(m.util):"—"}</td><td class="num">${fmt(m.acum)}</td></tr>`).join("") +
    `</tbody><tfoot><tr><td>Total</td><td class="num">${fmt(d.tI)}</td><td class="num">${fmt(d.tE)}</td><td class="num ${util<0?"neg":""}">${fmt(util)}</td><td></td></tr></tfoot></table>`;

  // Egresos por concepto
  const cons = [...new Set(CON_EGR.concat(d.eA.map(e => e.concepto)))].map(c => { const v = sum(d.eA.filter(e => e.concepto === c)); return { c, v }; }).filter(x => x.v > 0).sort((a,b) => b.v - a.v);
  $("aCon").innerHTML = !cons.length ? `<div class="empty">Sin egresos en ${A}.</div>` :
    cons.map(x => `<div class="conrow"><div class="h"><span>${ICON_EGR[x.c]||"📌"} ${esc(x.c)}</span><b>${fmt(x.v)}</b></div>
      <div class="bar"><i style="width:${(x.v/cons[0].v*100).toFixed(1)}%;background:var(--s2)"></i></div>
      <div class="t2">${(x.v/d.tE*100).toFixed(0)}% de los egresos · promedio ${fmt(x.v/mesesCorridos)}/mes${d.tI?` · ${(x.v/d.tI*100).toFixed(0)}% de los ingresos`:""}</div></div>`).join("");

  // Rentabilidad por inmueble
  const inms = inmOrdenados().filter(i => !I || i.id === I);
  $("aInmTabla").innerHTML = !inms.length ? `<div class="empty">Registra tus inmuebles para ver su rentabilidad.</div>` :
    inms.map(i => {
      const di = datosAnalisis(A, i.id), u = di.tI - di.tE;
      const mesesArr = new Set(di.iA.filter(x => x.concepto === "Arriendo").map(x => String(x.fecha).slice(5,7))).size;
      return `<div class="item" data-inm="${esc(i.id)}"><div class="tx"><div class="t1">${esc(etq(i.id))}</div>
        <div class="t2">Ingresos ${fmt(di.tI)} · Egresos ${fmt(di.tE)}</div>
        <div class="t2">Margen ${di.tI?(u/di.tI*100).toFixed(0)+"%":"—"} · Arriendo recibido ${mesesArr} de ${mesesCorridos} meses</div></div>
        <div class="amt ${u>=0?"pos":"neg"}">${fmt(u)}</div></div>`;
    }).join("");
  $("aInmTabla").querySelectorAll("[data-inm]").forEach(el => el.onclick = () => abrirDetalle(el.dataset.inm, "ingresos"));
}

function dibujarMensual(meses){
  const box = $("aChart");
  const max = Math.max(1, ...meses.map(m => Math.max(m.ing, m.egr)));
  const W = Math.max(320, box.clientWidth || 340), H = 220, padL = 44, padB = 22, padT = 8, h = H - padB - padT;
  const banda = (W - padL - 4) / 12, bw = Math.min(12, (banda - 6) / 2);
  const paso = (() => { const raw = max / 4, p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n<=1?1:n<=2?2:n<=5?5:10) * p; })();
  const top = Math.ceil(max / paso) * paso, y = v => padT + h - v / top * h;
  const corto = v => v >= 1e6 ? (v/1e6).toLocaleString("es-CO",{maximumFractionDigits:1}) + "M" : v >= 1e3 ? Math.round(v/1e3) + "k" : String(v);
  const barra = (x, v, color) => { if(!v) return ""; const yy = y(v), hh = padT + h - yy, r = Math.min(4, hh); return `<path d="M${x},${padT+h} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+bw-r} Q${x+bw},${yy} ${x+bw},${yy+r} V${padT+h} Z" fill="${color}"/>`; };
  let g = "";
  for(let v = 0; v <= top + 1e-9; v += paso) g += `<line x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${padL-6}" y="${y(v)+4}" text-anchor="end" class="ax">${corto(v)}</text>`;
  meses.forEach((m, k) => {
    const cx = padL + banda * k + banda / 2;
    g += barra(cx - bw - 1, m.ing, "var(--s1)") + barra(cx + 1, m.egr, "var(--s2)");
    g += `<text x="${cx}" y="${H-6}" text-anchor="middle" class="ax">${MES3[k].slice(0,1)}</text>`;
    g += `<rect x="${padL + banda*k}" y="${padT}" width="${banda}" height="${h}" fill="transparent" data-k="${k}" class="hit"/>`;
  });
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Ingresos y egresos por mes">${g}</svg><div class="tip hide" id="aTip"></div>`;
  const tip = $("aTip");
  box.querySelectorAll(".hit").forEach(r => {
    const mostrar = () => {
      const m = meses[+r.dataset.k];
      box.querySelectorAll(".hit").forEach(z => z.setAttribute("fill", z === r ? "rgba(29,92,134,.07)" : "transparent"));
      tip.innerHTML = `<b>${MESES[m.k]}</b><div><i style="background:var(--s1)"></i>Ingresos <span>${fmt(m.ing)}</span></div><div><i style="background:var(--s2)"></i>Egresos <span>${fmt(m.egr)}</span></div><div style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px">Utilidad <span class="${m.util<0?"neg":""}">${fmt(m.util)}</span></div>`;
      tip.classList.remove("hide");
      const bx = box.getBoundingClientRect(), rb = r.getBoundingClientRect();
      let left = rb.left - bx.left + rb.width / 2 - tip.offsetWidth / 2;
      tip.style.left = Math.max(0, Math.min(bx.width - tip.offsetWidth, left)) + "px";
    };
    r.addEventListener("click", mostrar); r.addEventListener("mouseenter", mostrar);
  });
  box.onmouseleave = () => { tip.classList.add("hide"); box.querySelectorAll(".hit").forEach(z => z.setAttribute("fill", "transparent")); };
}

function libroExcel(){
  const wb = XLSX.utils.book_new();
  const hoja = (rows, hdr, name) => { const ws = XLSX.utils.json_to_sheet(rows, { header: hdr }); ws["!cols"] = hdr.map(h => ({ wch: /Inmueble|Notas|Observ|Descrip|Conjunto|Administrador|Empresa|Correo/.test(h) ? 28 : 14 })); XLSX.utils.book_append_sheet(wb, ws, name); };
  const ing = lista("ingresos"), egr = lista("egresos");
  // Análisis mensual: una fila por inmueble y mes con movimientos
  const claves = new Map();
  for(const x of ing) { const k = x.inmuebleId + "|" + String(x.fecha).slice(0,7); const o = claves.get(k) || { i:0, e:0 }; o.i += +x.valor||0; claves.set(k, o); }
  for(const x of egr) { const k = x.inmuebleId + "|" + String(x.fecha).slice(0,7); const o = claves.get(k) || { i:0, e:0 }; o.e += +x.valor||0; claves.set(k, o); }
  const mensual = [...claves.entries()].map(([k, o]) => { const [id, ym] = k.split("|"); const i = getR("inmuebles", id) || {}; return { Año:Number(ym.slice(0,4)), Mes:Number(ym.slice(5,7)), Nombre_Mes:MESES[Number(ym.slice(5,7))-1]||"", Conjunto:i.conjunto||"", Torre:i.torre||"", Apartamento:i.apartamento||"", Inmueble:etq(id), Ingresos:o.i, Egresos:o.e, Utilidad:o.i-o.e }; })
    .sort((a,b) => a.Año-b.Año || a.Mes-b.Mes || a.Inmueble.localeCompare(b.Inmueble, "es", { numeric:true }));
  hoja(mensual, ["Año","Mes","Nombre_Mes","Conjunto","Torre","Apartamento","Inmueble","Ingresos","Egresos","Utilidad"], "Analisis_Mensual");
  hoja(inmOrdenados().map(i => { const a = i.admin || {}; return { ID:i.id, Conjunto:i.conjunto, Torre:i.torre, Apartamento:i.apartamento, Propietario:i.propietario||"", Ciudad:i.ciudad||"", Notas:i.notas||"",
      Administrador:a.nombre||"", Empresa_Admin:a.empresa||"", Telefono_Admin:a.telefono||"", Correo_Admin:a.correo||"", Cuota_Admin:a.cuota||"", Dia_Pago:a.diaPago||"", Referencia_Pago:a.referencia||"", Notas_Admin:a.notas||"" }; }),
    ["ID","Conjunto","Torre","Apartamento","Propietario","Ciudad","Notas","Administrador","Empresa_Admin","Telefono_Admin","Correo_Admin","Cuota_Admin","Dia_Pago","Referencia_Pago","Notas_Admin"], "Inmuebles");
  const mov = (x) => { const i = getR("inmuebles", x.inmuebleId) || {}; return { Año:Number(String(x.fecha).slice(0,4))||"", Mes:Number(String(x.fecha).slice(5,7))||"", Conjunto:i.conjunto||"", Torre:i.torre||"", Apartamento:i.apartamento||"" }; };
  hoja(ing.sort((a,b) => String(a.fecha).localeCompare(String(b.fecha))).map(g => ({ ID:g.id, Fecha:g.fecha, ...mov(g), ID_Inmueble:g.inmuebleId, Inmueble:etq(g.inmuebleId), Concepto:g.concepto, Valor:+g.valor||0, Medio_Pago:g.medio||"", Notas:g.notas||"" })),
    ["ID","Fecha","Año","Mes","Conjunto","Torre","Apartamento","ID_Inmueble","Inmueble","Concepto","Valor","Medio_Pago","Notas"], "Ingresos");
  hoja(egr.sort((a,b) => String(a.fecha).localeCompare(String(b.fecha))).map(e => ({ ID:e.id, Fecha:e.fecha, ...mov(e), ID_Inmueble:e.inmuebleId, Inmueble:etq(e.inmuebleId), Concepto:e.concepto, Periodo:e.periodo||"", Valor:+e.valor||0, Estado:e.estado||"", Notas:e.notas||"" })),
    ["ID","Fecha","Año","Mes","Conjunto","Torre","Apartamento","ID_Inmueble","Inmueble","Concepto","Periodo","Valor","Estado","Notas"], "Egresos");
  hoja(lista("inventario").sort((a,b) => (etq(a.inmuebleId)+a.espacio+a.nombre).localeCompare(etq(b.inmuebleId)+b.espacio+b.nombre, "es")).map(x => ({ ID:x.id, ID_Inmueble:x.inmuebleId, Inmueble:etq(x.inmuebleId), Espacio:x.espacio||"", Elemento:x.nombre, Cantidad:Number(x.cantidad)||1, Estado:x.estado||"", Descripcion:x.descripcion||"", Observaciones:x.observaciones||"" })),
    ["ID","ID_Inmueble","Inmueble","Espacio","Elemento","Cantidad","Estado","Descripcion","Observaciones"], "Inventario");
  return XLSX.write(wb, { bookType:"xlsx", type:"array" });
}
async function descargarExcel(){
  if(typeof XLSX === "undefined") return toast("El componente de Excel aún está cargando");
  const nombre = `Mis_Inmuebles_${hoy()}.xlsx`;
  const blob = new Blob([libroExcel()], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const marcar = () => { meta.lastBackup = new Date().toISOString(); guardarLocal(); renderAviso(); pintarEstado(); };
  const file = new File([blob], nombre, { type: blob.type });
  if(navigator.canShare && navigator.canShare({ files:[file] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)){
    try{ await navigator.share({ files:[file], title:nombre }); marcar(); return; }catch(e){ if(e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  marcar(); toast("Excel descargado ✔");
}

    if(!(await confirmar(`Se cargarán ${inm.length} inmuebles, ${ing.length} ingresos, ${egr.length} egresos y ${inv.length} elementos de inventario. Los registros con el mismo ID se reemplazan.`, "Importar"))) return;
    const t = Date.now();
    for(const [c, arr] of [["inmuebles",inm],["ingresos",ing],["egresos",egr],["inventario",inv]]) for(const r of arr){ r.upd = t; D[c][r.id] = r; marcarSucio(c, r.id); }
    await guardarLocal(); renderTodo(); programarSync(200); toast("Importación lista ✔");
  }catch(e){ console.error(e); toast("El archivo no tiene el formato esperado"); }
};
